name: Publish @ryumy97/floaty-react

on:
  # Manual GitHub Releases (UI / gh with a PAT) still trigger this.
  # Releases created by release.yml use GITHUB_TOKEN and do not; that workflow
  # dispatches this one via workflow_dispatch instead.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and verify without publishing
        type: boolean
        default: false

# OIDC trusted publishing — no NPM_TOKEN. Configure on npmjs.com:
# Package → Settings → Trusted Publisher → GitHub Actions
#   Organization or user: ryumy97
#   Repository: floaty
#   Workflow filename: publish.yml
#   Allowed actions: include "npm publish" (not only staged publish)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Do not set registry-url here: setup-node would write an empty
      # _authToken into .npmrc, which makes pnpm skip the OIDC exchange.
      # See https://github.com/actions/setup-node/issues/1551
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: pnpm

      # pnpm publish delegates to `npm publish`. OIDC needs npm >= 11.5.1;
      # Node 22 ships npm 10.x. Pin npm 11 (not 12+) so --no-git-checks still works.
      - name: Pin npm 11 for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @ryumy97/floaty-react test

      - name: Build
        run: pnpm --filter @ryumy97/floaty-react build

      - name: Publish (dry run)
        if: ${{ inputs.dry_run == true }}
        working-directory: packages/react
        run: pnpm publish --dry-run --no-git-checks --access public

      - name: Publish
        if: ${{ inputs.dry_run != true }}
        working-directory: packages/react
        # Provenance is automatic with trusted publishing; no NPM_TOKEN.
        run: pnpm publish --no-git-checks --access public
