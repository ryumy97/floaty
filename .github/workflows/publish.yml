name: Publish @ryumy97/floaty-react

on:
  # Manual GitHub Releases (UI / gh with a PAT) still trigger this.
  # Releases created by release.yml use GITHUB_TOKEN and do not; that workflow
  # dispatches this one via workflow_dispatch instead.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and verify without publishing
        type: boolean
        default: false

# OIDC trusted publishing — no NPM_TOKEN. Match npmjs.com Trusted Publisher:
#   Organization or user: ryumy97
#   Repository: floaty
#   Workflow filename: publish.yml
#   Environment: NPM_PUBLISH_VARS
#   Allowed actions: npm stage publish
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match the Environment name on the npm Trusted Publisher.
    environment: NPM_PUBLISH_VARS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Do not set registry-url here: setup-node would write an empty
      # _authToken into .npmrc, which makes OIDC skip the token exchange.
      # See https://github.com/actions/setup-node/issues/1551
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; staged publish needs >= 11.15.
      # pnpm 10's `pnpm publish` does not perform OIDC — use npm directly.
      # See https://github.com/pnpm/pnpm/issues/11513
      - name: Pin npm for OIDC trusted publishing
        run: |
          npm install -g npm@11.15.0
          npm --version
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "ACTIONS_ID_TOKEN_REQUEST_URL is unset; id-token: write is required."
            exit 1
          }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @ryumy97/floaty-react test

      - name: Build
        run: pnpm --filter @ryumy97/floaty-react build

      - name: Stage publish (dry run)
        if: ${{ inputs.dry_run == true }}
        working-directory: packages/react
        run: npm stage publish --dry-run --access public

      - name: Stage publish
        if: ${{ inputs.dry_run != true }}
        working-directory: packages/react
        # Trusted publisher allows stage only. Approve on npmjs.com (Staged
        # Packages) or `npm stage approve <id>` with 2FA to go live.
        run: npm stage publish --access public
